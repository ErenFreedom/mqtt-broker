<!DOCTYPE html>
<html>
<head>
  <title>Edge Login</title>

  <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
  <div class="card p-4 mx-auto shadow" style="max-width:420px">

    <h4 class="text-center mb-3">🔐 Edge Device Login</h4>

    <p class="text-muted text-center mb-4" style="font-size: 13px;">
      Login to connect this device to your cloud site
    </p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for c, m in messages %}
        <div class="alert alert-{{ c }} alert-dismissible fade show">
          {{ m }}
          <button class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endwith %}

    <form method="post">

      <label class="form-label">Email</label>
      <input type="email" class="form-control mb-3" name="email" required>

      <label class="form-label">Password</label>
      <input type="password" class="form-control mb-4" name="password" required>

      <button class="btn btn-primary w-100">
        Login
      </button>

    </form>

  </div>
</div>

<script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>

</body>
</html>
