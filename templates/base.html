<!DOCTYPE html>
<html>
<head>
  <title>API Desktop App</title>
  <!-- ✅ Offline Bootstrap CSS -->
  <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-3 d-flex justify-content-between">
  <div>
    <span class="navbar-brand">API Desktop App</span>
    <a href="/welcome" class="btn btn-outline-light btn-sm ms-3">🏠 Home</a>
  </div>
  <span class="text-white">Welcome {{ session.username }}</span>
</nav>

<div class="container-fluid p-4">

{% with messages = get_flashed_messages(with_categories=true) %}
  {% for c, m in messages %}
    <div class="alert alert-{{ c }} alert-dismissible fade show">
      {{ m }}
      <button class="btn-close" data-bs-dismiss="alert"></button>
    </div>
  {% endfor %}
{% endwith %}

{% block content %}{% endblock %}
</div>

<!-- ✅ Offline Bootstrap JS -->
<script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
