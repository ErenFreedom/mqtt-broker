{% extends "base.html" %}
{% block content %}

<div class="card p-4 mx-auto shadow" style="max-width:450px">

  <h4 class="text-center mb-3">⚙️ Desigo Login</h4>

  <p class="text-muted text-center mb-4">
    Connect to Desigo to start fetching data
  </p>

  <form method="post">

    <label class="form-label">Username</label>
    <input type="text" class="form-control mb-3" name="username" required>

    <label class="form-label">Password</label>
    <input type="password" class="form-control mb-4" name="password" required>

    <button class="btn btn-success w-100">
      Connect
    </button>

  </form>

</div>

{% endblock %}
