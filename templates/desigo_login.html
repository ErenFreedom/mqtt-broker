{% extends "base.html" %}
{% block content %}

<div class="card p-4 mx-auto shadow" style="max-width:500px">

  <h4 class="text-center mb-3">⚙️ Desigo Connection</h4>

  <p class="text-muted text-center mb-4">
    Enter Desigo API details to fetch token and start data flow
  </p>

  <form method="post">

    <!-- TOKEN API URL -->
    <label class="form-label">Token API URL</label>
    <input 
      type="text" 
      class="form-control mb-3" 
      name="api_url" 
      placeholder="https://desigo-server/token"
      required
    >

    <!-- USERNAME -->
    <label class="form-label">Username</label>
    <input 
      type="text" 
      class="form-control mb-3" 
      name="username" 
      required
    >

    <!-- PASSWORD -->
    <label class="form-label">Password</label>
    <input 
      type="password" 
      class="form-control mb-4" 
      name="password" 
      required
    >

    <button class="btn btn-success w-100">
      Connect & Fetch Token
    </button>

  </form>

</div>

{% endblock %}
