{% extends "base.html" %}
{% block content %}

<a href="/welcome" class="btn btn-secondary mb-3">⬅ Back</a>

<h4>Live API : {{ api_name }}</h4>

<div class="card p-4 text-center">
  <h1 id="value" class="display-4 text-success">--</h1>
  <p id="time" class="text-muted"></p>
</div>

<script>
function load() {
  fetch("/fetch/{{ api_name }}")
    .then(res => res.json())
    .then(data => {
      if(data.value !== null && data.value !== undefined){
        document.getElementById("value").innerText = data.value;
        document.getElementById("time").innerText =
          "Updated: " + new Date().toLocaleTimeString();
      } else {
        document.getElementById("value").innerText = "--";
      }
    })
    .catch(() => {
      document.getElementById("value").innerText = "Error";
    });
}

setInterval(load, 3000);
load();
</script>

{% endblock %}
