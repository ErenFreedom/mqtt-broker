<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
</head>
<body>

<h2>Dashboard</h2>

{% with messages = get_flashed_messages(with_categories=true) %}
  {% for category, message in messages %}
    <p style="color:green">{{ message }}</p>
  {% endfor %}
{% endwith %}

<h3>Add New API</h3>
<form method="post" action="/add_api">
    <input type="text" name="api_name" placeholder="API Name">
    <input type="text" name="api_url" placeholder="API URL">
    <button type="submit">Add API</button>
</form>

<hr>

<h3>Added APIs</h3>
{% for name in apis %}
    <form method="get" action="/call_api/{{ name }}">
        <button type="submit">{{ name }}</button>
    </form>
{% endfor %}

<br>
<a href="/logout">Logout</a>

</body>
</html>
